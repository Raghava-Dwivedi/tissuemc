name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync Python tools
        run: uv sync
      - name: Configure
        run: uv run cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: uv run cmake --build build
      - name: C++ unit tests
        run: uv run ctest --test-dir build --output-on-failure
      - name: Python tests
        run: uv run pytest -q
      - name: Validation suite (published values and independent oracle)
        run: uv run tissuemc-validate --binary build/tissuemc

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Configure (Debug, sanitizers)
        run: uv run cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTISSUEMC_SANITIZE=ON
      - name: Build
        run: uv run cmake --build build-san
      - name: Tests under sanitizers
        run: uv run ctest --test-dir build-san --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Configure (Debug, TSan)
        run: uv run cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTISSUEMC_TSAN=ON
      - name: Build
        run: uv run cmake --build build-tsan
      - name: Threaded-engine tests under ThreadSanitizer
        # The single-threaded statistical tests add minutes under TSan and exercise no threading.
        run: ./build-tsan/tissuemc_tests --test-case="*thread*,*partition*,*reproducible*,*invariants*"

  cuda-compile:
    name: CUDA compile check (no GPU on the runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Install the CUDA toolkit and a host compiler it supports
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-12 nvidia-cuda-toolkit
      - name: Configure for the T4 (sm_75)
        run: >
          uv run cmake -S . -B build-cuda -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DTISSUEMC_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75
          -DCMAKE_CUDA_HOST_COMPILER=g++-12 -DTISSUEMC_BUILD_TESTS=OFF
      - name: Build (compile and link only; running needs a GPU)
        run: uv run cmake --build build-cuda
      - name: The binary reports the CUDA engine as built in
        run: ./build-cuda/tissuemc --version
      - name: What the compiler did with each kernel (information only)
        continue-on-error: true
        run: |
          # Registers and stack frame per kernel, then the static count of local-memory
          # instructions (LDL/STL) in each kernel's SASS. Local memory is the measured limiter.
          cuobjdump --dump-resource-usage build-cuda/tissuemc | grep -E 'Function|REG' | paste - - | sed 's/Resource usage://' | cut -c1-260
          # Also: CALL = device functions the compiler did not inline (their arguments must live on
          # the stack); fixed = local accesses at a fixed stack offset, dynamic = at a computed
          # address (the signature of an array indexed at run time). ATOMS = atomics in shared
          # memory; ATOM and RED = atomics on global memory.
          cuobjdump -sass build-cuda/tissuemc | awk '
            /Function :/ {fn=$3; seen[fn]=1}
            /CALL/ {call[fn]++}
            /ATOMS/ {atoms[fn]++}
            /ATOM\./ {atom[fn]++}
            / RED\./ {red[fn]++}
            /LDL|STL/ { if ($0 ~ /\[R1(\+0x[0-9a-f]+)?\]/) fixed[fn]++; else dyn[fn]++ }
            /LDL/ {ld[fn]++} /STL/ {st[fn]++}
            END {for (f in seen) printf "%-100s LDL=%d STL=%d fixed=%d dynamic=%d CALL=%d ATOMS(shared)=%d ATOM(global)=%d RED(global)=%d\n", f, ld[f], st[f], fixed[f], dyn[f], call[f], atoms[f], atom[f], red[f]}'

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: clang-format
        run: uv run clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp' '*.cu' '*.cuh')
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
