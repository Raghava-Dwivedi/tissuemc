name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync Python tools
        run: uv sync
      - name: Configure
        run: uv run cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: uv run cmake --build build
      - name: C++ unit tests
        run: uv run ctest --test-dir build --output-on-failure
      - name: Python tests
        run: uv run pytest -q
      - name: Validation suite (published values and independent oracle)
        run: uv run tissuemc-validate --binary build/tissuemc

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Configure (Debug, sanitizers)
        run: uv run cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTISSUEMC_SANITIZE=ON
      - name: Build
        run: uv run cmake --build build-san
      - name: Tests under sanitizers
        run: uv run ctest --test-dir build-san --output-on-failure

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: clang-format
        run: uv run clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.hpp' '*.cu' '*.cuh')
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
