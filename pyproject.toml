[project]
name = "tissuemc-analysis"
version = "0.1.0"
description = "Statistics, validation and plotting for TissueMC results"
readme = "README.md"
license = "MIT"
authors = [{ name = "Raghava Dwivedi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]

[project.scripts]
tissuemc-validate = "tissuemc_analysis.validate:main"
tissuemc-bench = "tissuemc_analysis.bench:main"
tissuemc-plot = "tissuemc_analysis.plots:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "cmake>=3.24", "ninja>=1.11", "clang-format>=18", "matplotlib>=3.8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/tissuemc_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
